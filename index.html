<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="theme-toggle">
        <button id="theme-button">Dark Mode</button>
    </div>
    <div class="container">
        <h1>Lotto Number Generator</h1>
        <div id="numbers-display" class="numbers-display"></div>
        <button id="generate-button">Generate Numbers</button>
    </div>

    <div class="container contact-section">
        <h2>Partnership Inquiry</h2>
        <form action="https://formspree.io/f/xykdldda" method="POST" id="contact-form">
            <div class="form-group">
                <input type="email" name="email" placeholder="Your Email Address" required>
            </div>
            <div class="form-group">
                <textarea name="message" placeholder="Tell us about your proposal..." required></textarea>
            </div>
            <button type="submit" id="submit-button">Send Inquiry</button>
        </form>
    </div>
    <script src="main.js"></script>
</body>
</html>
