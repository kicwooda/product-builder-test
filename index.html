<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Classifier & Lotto</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body>
    <div class="theme-toggle">
        <button id="theme-button">Dark Mode</button>
    </div>

    <!-- Country Classifier Section -->
    <div class="container">
        <h1>Country Classifier</h1>
        <p>USA vs China Test</p>
        <div id="upload-area" class="upload-area">
            <input type="file" id="image-input" accept="image/*" hidden>
            <button id="upload-button">Upload Image</button>
            <div id="image-preview" class="image-preview"></div>
        </div>
        <div id="label-container" class="label-container"></div>
        <div id="loading-model" style="display:none;">Loading Model...</div>
    </div>

    <!-- Lotto Generator Section -->
    <div class="container">
        <h1>Lotto Number Generator</h1>
        <div id="numbers-display" class="numbers-display"></div>
        <button id="generate-button">Generate Numbers</button>
    </div>

    <div class="container contact-section">
        <h2>Partnership Inquiry</h2>
        <form action="https://formspree.io/f/xykdldda" method="POST" id="contact-form">
            <div class="form-group">
                <input type="email" name="email" placeholder="Your Email Address" required>
            </div>
            <div class="form-group">
                <textarea name="message" placeholder="Tell us about your proposal..." required></textarea>
            </div>
            <button type="submit" id="submit-button">Send Inquiry</button>
        </form>
    </div>

    <div class="container disqus-section">
        <div id="disqus_thread"></div>
    </div>

    <script>
        (function() {
        var d = document, s = d.createElement('script');
        s.src = 'https://kicwoo.disqus.com/embed.js';
        s.setAttribute('data-timestamp', +new Date());
        (d.head || d.body).appendChild(s);
        })();
    </script>
    <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
    <script src="main.js"></script>
</body>
</html>
